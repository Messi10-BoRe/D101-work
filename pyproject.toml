[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d101-work"
version = "0.1.0"
description = "A starter Python project for D101-work"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Messi10-BoRe" }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
